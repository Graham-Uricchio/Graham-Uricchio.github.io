name: Lint HTML

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
